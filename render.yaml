services:
  - type: web
    name: myportfolio
    env: node
    buildCommand: "pnpm run build"
    startCommand: "pnpm start"
    envVars:
      - key: VITE_PUBLIC_BUILDER_KEY
        value: __BUILDER_PUBLIC_KEY__
      - key: PING_MESSAGE
        value: "ping pong"
      - key: GOOGLE_SHEETS_SCRIPT_URL
        scope: runtime
